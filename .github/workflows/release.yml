name: release

on:
  push:
    branches: [main]

permissions:
  # Required for Octo STS to federate the Actions OIDC token into a GitHub App
  # installation token that semantic-release uses to commit/tag/release.
  id-token: write
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      # Mint a short-lived, tightly-scoped GitHub App token (see
      # .github/chainguard/release.sts.yaml) instead of using the broad default
      # GITHUB_TOKEN or a long-lived PAT.
      - uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: release

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GIT_AUTHOR_NAME: opencode-claude-compat release bot
          GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-claude-compat release bot
          GIT_COMMITTER_EMAIL: github-actions@users.noreply.github.com
        run: npx --no-install semantic-release
